name: darpik
description: "تطبيق سياحي لمدينة الرياض"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.5
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore:
  firebase_storage:
  image_picker:
  carousel_slider:
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  intl: ^0.19.0
  card_swiper: ^2.0.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  connectivity: ^3.0.6
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.jpeg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

